---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: restores.bret.linogics.io
spec:
  group: bret.linogics.io
  names:
    kind: Restore
    listKind: RestoreList
    plural: restores
    shortNames:
    - restore
    singular: restore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.attempt
      name: Attempt
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Restore is one restore run, manual or started by a RestoreTest.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired state of the restore.
            properties:
              keepOnFailure:
                default: false
                description: KeepOnFailure keeps the check pod, the scratch volume
                  and the native restore object when the attempt fails.
                type: boolean
              provider:
                description: Provider is the backup tool that performs the restore.
                enum:
                - velero
                - volsync
                - kopiur
                type: string
              restoreCheckRef:
                description: RestoreCheckRef is the RestoreCheck that checks the restored
                  data.
                properties:
                  name:
                    description: Name is the name of the RestoreCheck in the same
                      namespace.
                    type: string
                required:
                - name
                type: object
              restoreWindow:
                default: 45m
                description: RestoreWindow is the deadline for this attempt, covering
                  the restore, image pulls and the check.
                type: string
              source:
                description: Source is the backup to restore from.
                properties:
                  backupRef:
                    description: BackupRef is the backup to restore.
                    properties:
                      name:
                        description: Name is the name of the backup object.
                        type: string
                      namespace:
                        description: Namespace is the namespace of the backup object.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - backupRef
                type: object
              target:
                description: Target is the scratch volume to restore into.
                properties:
                  autoExpand:
                    description: AutoExpand derives the size from the source size
                      when Size is unset.
                    properties:
                      max:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Max is the upper bound of the derived size.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      min:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Min is the lower bound of the derived size.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      percentage:
                        description: Percentage is the headroom added on top of the
                          source size, in percent.
                        format: int32
                        type: integer
                    required:
                    - percentage
                    type: object
                    x-kubernetes-validations:
                    - message: percentage must be greater than 0
                      rule: self.percentage > 0
                    - message: percentage must not be greater than 1000
                      rule: self.percentage <= 1000
                    - message: min must not be greater than max
                      rule: '!has(self.min) || !has(self.max) || quantity(self.min).compareTo(quantity(self.max))
                        <= 0'
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Size is the capacity of the scratch volume. When
                      unset, it is derived from the source size.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: StorageClassName is the storage class of the scratch
                      volume.
                    type: string
                type: object
            required:
            - provider
            - restoreCheckRef
            - source
            - target
            type: object
          status:
            description: Status is the observed state of the restore.
            properties:
              attempt:
                description: Attempt is the number of the current attempt, starting
                  at 1.
                format: int32
                type: integer
              conditions:
                description: Conditions are the latest observations of the restore
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deadline:
                description: Deadline is when the current attempt times out.
                format: date-time
                type: string
              message:
                description: Message is a human-readable detail about the current
                  phase.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Canceled
                type: string
              providerRef:
                description: ProviderRef is the native object created by the provider.
                properties:
                  kind:
                    description: Kind is the kind of the native object.
                    type: string
                  name:
                    description: Name is the name of the native object.
                    type: string
                  namespace:
                    description: Namespace is the namespace of the native object.
                    type: string
                type: object
              resolvedSize:
                anyOf:
                - type: integer
                - type: string
                description: ResolvedSize is the scratch size resolved on the first
                  reconcile. Later reconciles reuse it.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              startTime:
                description: StartTime is when the first attempt started.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
