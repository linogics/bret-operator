---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: restores.bret.linogics.io
spec:
  group: bret.linogics.io
  names:
    kind: Restore
    listKind: RestoreList
    plural: restores
    shortNames:
    - restore
    singular: restore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.attempt
      name: Attempt
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Restore is one restore run. It is manual or started by a RestoreTest.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Spec is the desired state of the restore. It cannot change after creation, so the status always
              describes the backups in the spec.
            properties:
              keepOnFailure:
                default: false
                description: KeepOnFailure keeps the check pod, scratch volume and
                  native restore object after a failed attempt.
                type: boolean
              provider:
                description: Provider is the backup tool that performs the restore.
                enum:
                - velero
                - volsync
                - kopiur
                type: string
              restoreCheckRef:
                description: RestoreCheckRef is the RestoreCheck that checks the restored
                  data.
                properties:
                  name:
                    description: Name is the name of the RestoreCheck in the same
                      namespace.
                    type: string
                required:
                - name
                type: object
              restoreWindow:
                default: 45m
                description: RestoreWindow is the deadline for this attempt. It covers
                  the restore, image pulls and the check.
                type: string
                x-kubernetes-validations:
                - message: restoreWindow must be at least 1m, 0s means the default
                  rule: duration(self) == duration('0s') || duration(self) >= duration('1m')
              sources:
                description: Sources are the backups to restore from, each with its
                  scratch volume.
                items:
                  description: RestoreSource identifies one backup a Restore reads
                    from and the scratch volume it writes into.
                  properties:
                    autoExpand:
                      description: AutoExpand derives the size from the source size
                        when Size is unset.
                      properties:
                        max:
                          anyOf:
                          - type: integer
                          - type: string
                          description: Max is the upper bound of the derived size.
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        min:
                          anyOf:
                          - type: integer
                          - type: string
                          description: Min is the lower bound of the derived size.
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        percentage:
                          description: Percentage is the headroom added to the source
                            size, in percent.
                          format: int32
                          type: integer
                      required:
                      - percentage
                      type: object
                      x-kubernetes-validations:
                      - message: percentage must be greater than 0
                        rule: self.percentage > 0
                      - message: percentage must not be greater than 1000
                        rule: self.percentage <= 1000
                      - message: min must not be greater than max
                        rule: '!has(self.min) || !has(self.max) || quantity(self.min).compareTo(quantity(self.max))
                          <= 0'
                    backupRef:
                      description: BackupRef is the backup to restore. Velero sources
                        all name the same Backup.
                      properties:
                        name:
                          description: Name is the name of the backup object.
                          type: string
                        namespace:
                          description: Namespace is the namespace of the backup object.
                          type: string
                      required:
                      - name
                      type: object
                    restoreAsOf:
                      description: |-
                        RestoreAsOf restores the newest snapshot taken at or before this time. VolSync only.
                        Unset restores the newest snapshot.
                      format: date-time
                      type: string
                    size:
                      anyOf:
                      - type: integer
                      - type: string
                      description: Size is the capacity of the scratch volume. When
                        unset, AutoExpand derives it from the source size.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    sourcePVC:
                      description: SourcePVC is the name of the PVC in the backed-up
                        namespace that this source restores.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    storageClassName:
                      description: StorageClassName is the storage class of the scratch
                        volume.
                      type: string
                  required:
                  - backupRef
                  - sourcePVC
                  type: object
                maxItems: 10
                minItems: 1
                type: array
              velero:
                description: Velero narrows what a Velero restore brings back. Velero
                  only.
                properties:
                  labelSelector:
                    description: LabelSelector selects the namespace objects to restore.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  orLabelSelectors:
                    description: OrLabelSelectors select the namespace objects to
                      restore, any one may match.
                    items:
                      description: |-
                        A label selector is a label query over a set of resources. The result of matchLabels and
                        matchExpressions are ANDed. An empty label selector matches all objects. A null
                        label selector matches no objects.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    type: array
                type: object
                x-kubernetes-validations:
                - message: labelSelector and orLabelSelectors are mutually exclusive
                  rule: '!(has(self.labelSelector) && has(self.orLabelSelectors))'
            required:
            - provider
            - restoreCheckRef
            - sources
            type: object
            x-kubernetes-validations:
            - message: spec is immutable, create a new Restore
              rule: self == oldSelf
            - message: sourcePVC must be unique across sources
              rule: self.sources.all(s, self.sources.exists_one(o, o.sourcePVC ==
                s.sourcePVC))
            - message: provider velero needs the same backupRef on every source and
                no size, autoExpand or storageClassName
              rule: self.provider != 'velero' || self.sources.all(s, s.backupRef ==
                self.sources[0].backupRef && !has(s.size) && !has(s.autoExpand) &&
                !has(s.storageClassName))
            - message: spec.velero is only allowed with provider velero
              rule: self.provider == 'velero' || !has(self.velero)
            - message: restoreAsOf is only allowed with provider volsync
              rule: self.provider == 'volsync' || self.sources.all(s, !has(s.restoreAsOf))
          status:
            description: Status is the observed state of the restore.
            properties:
              attempt:
                description: Attempt is the number of the current attempt, starting
                  at 1.
                format: int32
                type: integer
              conditions:
                description: Conditions are the latest observations of the restore
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deadline:
                description: Deadline is when the current attempt times out.
                format: date-time
                type: string
              message:
                description: Message is a human-readable detail about the current
                  phase.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Canceled
                type: string
              providerRefs:
                description: ProviderRefs are the native objects created by the provider.
                items:
                  description: ProviderRef identifies the native object created by
                    the provider.
                  properties:
                    kind:
                      description: Kind is the kind of the native object.
                      type: string
                    name:
                      description: Name is the name of the native object.
                      type: string
                    namespace:
                      description: Namespace is the namespace of the native object.
                      type: string
                  type: object
                type: array
              resolvedSizes:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: |-
                  ResolvedSizes maps each sourcePVC to the scratch size resolved on the first reconcile. Later reconciles reuse it.
                  Velero uses the empty key.
                type: object
              startTime:
                description: StartTime is when the first attempt started.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 63 characters
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
