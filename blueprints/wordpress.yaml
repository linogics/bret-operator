# TESTED: round trip PASS, negative test FAIL as expected.
# DESIGN DELTA: restoredVolumes (not in design §7.1)
# Native sidecar: mariadb is an initContainer with restartPolicy: Always (k8s 1.29+), gated by
# startupProbe. Not in design §7.1 (see INDEX.md).
# Secret wordpress-db holds WORDPRESS_DB_USER, WORDPRESS_DB_PASSWORD, WORDPRESS_DB_NAME.
apiVersion: bret.linogics.io/v1alpha1
kind: RestoreBlueprint
metadata:
  name: wordpress
  namespace: default
  annotations:
    bret.linogics.io/mover-uid: '{"html": 33, "mysql": 999}'
spec:
  restoredVolumes:
  - name: html
    mountPath: /var/www/html
  - name: mysql
    mountPath: /var/lib/mysql

  initContainers:
  # The restored mount roots come back owned by root. WordPress (uid 33) writes under html and
  # MariaDB (uid 999) writes its data dir at the mysql root. Init containers with no
  # securityContext run as root and give the roots to those UIDs.
  - name: html-perms
    image: busybox:1.37
    command:
      - /bin/sh
      - -c
      - chown 33:33 /var/www/html
  - name: mysql-perms
    image: busybox:1.37
    command:
      - /bin/sh
      - -c
      - chown 999:999 /var/lib/mysql
  - name: mariadb
    image: mariadb:11.4
    restartPolicy: Always
    securityContext:
      runAsUser: 999
      runAsGroup: 999
    command:
      - mariadbd
      - --user=mysql
      - --datadir=/var/lib/mysql
      - --bind-address=127.0.0.1
      - --port=3306
    startupProbe:
      exec:
        command: ["mariadb-admin", "--host=127.0.0.1", "ping"]
      periodSeconds: 2
      failureThreshold: 90

  containers:
  - name: check
    image: wordpress:6.6-php8.3-apache
    securityContext:
      runAsUser: 33
      runAsGroup: 33
    env:
    - name: WORDPRESS_DB_HOST
      value: 127.0.0.1
    envFrom:
    - secretRef:
        name: wordpress-db
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        # Point the app at the sidecar on localhost.
        sed -i "s/'DB_HOST', '[^']*'/'DB_HOST', '127.0.0.1'/" /var/www/html/wp-config.php

        # Canary: the canary post's content must equal the sha256 of the uploaded file.
        cat > /tmp/canary.php <<'PHP'
        <?php
        $db = new mysqli(
            '127.0.0.1',
            getenv('WORDPRESS_DB_USER'),
            getenv('WORDPRESS_DB_PASSWORD'),
            getenv('WORDPRESS_DB_NAME')
        );
        $row = $db->query(
            "select post_content from wp_posts where post_name = 'bret-canary'"
            . " and post_status = 'publish'"
        )->fetch_row();
        if (!$row) {
            fwrite(STDERR, "canary post missing\n");
            exit(1);
        }
        $disk = hash_file('sha256', '/var/www/html/wp-content/uploads/bret-canary.txt');
        if (trim($row[0]) !== $disk) {
            fwrite(STDERR, "post hash != upload hash\n");
            exit(1);
        }
        echo "wordpress canary ok\n";
        PHP
        php /tmp/canary.php

  volumes: []
