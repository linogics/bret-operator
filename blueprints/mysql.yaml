# UNTESTED
# Restore check for mysql 8.4. Database-only, one PVC. Not run.
# Canary contract: table bret.canary(id int primary key, payload text, sha256 char(64)),
# row id=1 with sha256 = sha2(payload, 256), seeded before the backup.
apiVersion: restore.bret.linogics.io/v1alpha1
kind: RestoreBlueprint
metadata:
  name: mysql
  namespace: default
spec:
  restoreMount: /var/lib/mysql

  initContainers: []

  containers:
  - name: check
    image: mysql:8.4
    securityContext:
      runAsUser: 999
      runAsGroup: 999
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        # Start mysqld on the restored datadir, socket only.
        mysqld --user=mysql --datadir=/var/lib/mysql --socket=/tmp/mysql.sock \
            --skip-networking --mysqlx=OFF >/tmp/mysqld.log 2>&1 &
        for i in $(seq 1 150); do
          mysqladmin -S /tmp/mysql.sock ping >/dev/null 2>&1 && break
          sleep 1
        done
        trap 'mysqladmin -S /tmp/mysql.sock shutdown || true' EXIT

        # Table-level CHECK TABLE across all databases.
        mysqlcheck -S /tmp/mysql.sock --all-databases --check

        # Canary row: payload must still hash to the stored sha256.
        sql="select count(*) from bret.canary where id = 1 and sha2(payload, 256) = sha256"
        test "$(mysql -S /tmp/mysql.sock -N -e "$sql")" = 1

  volumes: []
