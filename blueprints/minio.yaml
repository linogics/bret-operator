# UNTESTED
# Restore check for minio. Files-only (objects on the drive as xl.meta + part files). Not run.
# TAG UNVERIFIED: minio and mc tags could not be confirmed.
# Canary contract: bucket bret-canary, objects canary.txt and canary.sha256 (sha256sum format),
# seeded before the backup. Secret minio-creds must hold the source MINIO_ROOT_USER/PASSWORD.
apiVersion: restore.bret.linogics.io/v1alpha1
kind: RestoreBlueprint
metadata:
  name: minio
  namespace: default
spec:
  restoreMount: /data

  initContainers:
  - name: fetch-mc
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z  # TAG UNVERIFIED
    command: ["/bin/sh", "-c", "cp /usr/bin/mc /tools/mc"]
    volumeMounts:
    - name: tools
      mountPath: /tools

  containers:
  - name: check
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z  # TAG UNVERIFIED
    envFrom:
    - secretRef:
        name: minio-creds
    volumeMounts:
    - name: tools
      mountPath: /tools
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        export PATH=/tools:$PATH

        # Serve the restored drive in the background and stop it on exit.
        minio server /data --address :9000 --console-address :9001 >/tmp/minio.log 2>&1 &
        trap 'kill $! 2>/dev/null || true' EXIT

        # Wait for readiness (up to 120 s).
        mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" \
            >/dev/null
        for i in $(seq 1 120); do
          mc ready local >/dev/null 2>&1 && break
          sleep 1
        done
        mc ready local

        # Canary object: content hash must match the stored checksum object.
        got=$(mc cat local/bret-canary/canary.txt | sha256sum | cut -d' ' -f1)
        want=$(mc cat local/bret-canary/canary.sha256 | cut -d' ' -f1)
        test "$got" = "$want"

  volumes:
  - name: tools
    emptyDir: {}
