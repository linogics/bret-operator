# Seed for checks/pihole.yaml. Two volumes: etc-pihole (/etc/pihole) and dnsmasq (/etc/dnsmasq.d).
# Writes gravity.db with the canary adlist, custom.list with the canary local record, setupVars,
# and one dnsmasq drop-in. Runs as root, the check sets no uid. Exits 0.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etc-pihole
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dnsmasq
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  containers:
    - name: seed
      image: pihole/pihole:2024.07.0
      command:
        - /bin/sh
        - -c
        - |
          mkdir -p /etc/pihole /etc/dnsmasq.d
          sqlite3 /etc/pihole/gravity.db <<'SQL'
          create table if not exists adlist (
            id integer primary key autoincrement,
            address text not null unique,
            enabled boolean not null default 1,
            comment text
          );
          insert or ignore into adlist (address, enabled, comment) values ('https://bret-canary.invalid/list.txt', 1, 'bret canary');
          insert or ignore into adlist (address, enabled, comment) values ('https://example.invalid/hosts.txt', 0, 'disabled sample');
          SQL
          printf '10.0.0.53 bret-canary.test\n' > /etc/pihole/custom.list
          printf 'PIHOLE_INTERFACE=eth0\nIPV4_ADDRESS=10.0.0.53/24\nWEBPASSWORD=\n' > /etc/pihole/setupVars.conf
          printf 'address=/bret-canary.test/10.0.0.53\n' > /etc/dnsmasq.d/02-bret.conf
          sync
      volumeMounts:
        - name: etc-pihole
          mountPath: /etc/pihole
        - name: dnsmasq
          mountPath: /etc/dnsmasq.d
  volumes:
    - name: etc-pihole
      persistentVolumeClaim:
        claimName: etc-pihole
    - name: dnsmasq
      persistentVolumeClaim:
        claimName: dnsmasq
