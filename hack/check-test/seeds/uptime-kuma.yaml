# Seed for checks/uptime-kuma.yaml. Mount is /app/data, owned by uid 1000 (node).
# Init "migrate" starts uptime-kuma once so it creates and migrates kuma.db, then stops it.
# Main "seed" inserts the inactive monitor bret-canary into the monitor table and exits 0.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
    - name: chown-data
      image: busybox:1.37
      securityContext:
        runAsUser: 0
      command:
        - "/bin/sh"
        - "-c"
        - "chown 1000:1000 /app/data"
      volumeMounts:
        - name: data
          mountPath: /app/data
    - name: migrate
      image: louislam/uptime-kuma:1.23.15
      securityContext:
        runAsUser: 1000
      command:
        - /bin/sh
        - -c
        - |
          cd /app
          node server/server.js >/tmp/seed-kuma.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:3001/api/entry-page >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/entry-page >/dev/null 2>&1 || exit 1
          kill "$pid"
          wait "$pid" 2>/dev/null
          test -s /app/data/kuma.db || exit 1
      volumeMounts:
        - name: data
          mountPath: /app/data
  containers:
    - name: seed
      image: louislam/uptime-kuma:1.23.15
      securityContext:
        runAsUser: 1000
      command:
        - /bin/sh
        - -c
        - |
          cat > /tmp/seed-kuma.js <<'JS'
          const sqlite3 = require('/app/node_modules/@louislam/sqlite3');
          const db = new sqlite3.Database('/app/data/kuma.db');
          const known = {
            name: 'bret-canary',
            active: 0,
            user_id: 1,
            interval: 60,
            url: 'https://bret-canary.invalid/',
            type: 'http',
            weight: 2000,
            created_date: new Date().toISOString(),
            accepted_statuscodes_json: '["200-299"]',
          };
          db.all('pragma table_info(monitor)', (e, cols) => {
            if (e) {
              console.error(e);
              process.exit(1);
            }
            const row = {};
            for (const c of cols) {
              if (c.name in known) {
                row[c.name] = known[c.name];
              } else if (c.notnull && c.dflt_value === null && c.pk === 0) {
                row[c.name] = /INT/i.test(c.type) ? 0 : (/BLOB/i.test(c.type) ? Buffer.alloc(0) : '');
              }
            }
            const names = Object.keys(row);
            const marks = names.map(() => '?').join(',');
            db.run(`insert into monitor (${names.join(',')}) values (${marks})`, names.map((n) => row[n]), (e2) => {
              if (e2) {
                console.error(e2);
                process.exit(1);
              }
              db.close();
            });
          });
          JS
          node /tmp/seed-kuma.js || exit 1
      volumeMounts:
        - name: data
          mountPath: /app/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
