# Seed for checks/nextcloud.yaml. Two PVCs named by the restoredVolumes keys: html and pgdata.
# html is /var/www/html (uid 33), pgdata is /var/lib/postgresql/data with PGDATA at pgdata/ (uid 999).
# Test-only values: nextcloud-db and the Nextcloud admin and user passwords below.
# Postgres runs as a native sidecar. Nextcloud is installed with occ, then user bret-canary
# gets the canary file, which occ files:scan records in oc_filecache.
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-db
type: Opaque
stringData:
  POSTGRES_PASSWORD: seed-nextcloud-db-not-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: html
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
    - name: chown-html
      image: busybox:1.37
      securityContext:
        runAsUser: 0
      command:
        - "/bin/sh"
        - "-c"
        - "chown 33:33 /var/www/html"
      volumeMounts:
        - name: html
          mountPath: /var/www/html
    - name: chown-pgdata
      image: busybox:1.37
      securityContext:
        runAsUser: 0
      command:
        - "/bin/sh"
        - "-c"
        - "chown 999:999 /var/lib/postgresql/data"
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
    - name: initdb
      image: postgres:17.12
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      command:
        - "initdb"
        - "-D"
        - "/var/lib/postgresql/data/pgdata"
        - "-U"
        - "postgres"
        - "--auth=trust"
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
    - name: postgres
      image: postgres:17.12
      restartPolicy: Always
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      command:
        - "postgres"
        - "-D"
        - "/var/lib/postgresql/data/pgdata"
        - "-c"
        - "listen_addresses=127.0.0.1"
      startupProbe:
        exec:
          command:
            - "pg_isready"
            - "-h"
            - "127.0.0.1"
        periodSeconds: 2
        failureThreshold: 90
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
    - name: create-db
      image: postgres:17.12
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      command:
        - psql
        - -h
        - 127.0.0.1
        - -U
        - postgres
        - -v
        - ON_ERROR_STOP=1
        - -c
        - "create role nextcloud login password 'seed-nextcloud-db-not-secret'"
        - -c
        - "create database nextcloud owner nextcloud"
  containers:
    - name: seed
      image: nextcloud:29-apache
      securityContext:
        runAsUser: 33
        runAsGroup: 33
      envFrom:
        - secretRef:
            name: nextcloud-db
      env:
        - name: NC_ADMIN_PASS
          value: seed-nextcloud-admin-not-secret
        - name: OC_PASS
          value: seed-nextcloud-user-not-secret
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          cp -a /usr/src/nextcloud/. /var/www/html/
          cd /var/www/html
          php occ maintenance:install --database pgsql --database-host 127.0.0.1 \
              --database-name nextcloud --database-user nextcloud --database-pass "$POSTGRES_PASSWORD" \
              --admin-user admin --admin-pass "$NC_ADMIN_PASS" --data-dir /var/www/html/data
          php occ user:add --password-from-env --display-name=bret-canary bret-canary
          mkdir -p data/bret-canary/files
          printf '%s' 'seed-canary-payload-not-secret' > data/bret-canary/files/bret-canary.txt
          php occ files:scan bret-canary
          sync
      volumeMounts:
        - name: html
          mountPath: /var/www/html
  volumes:
    - name: html
      persistentVolumeClaim:
        claimName: html
    - name: pgdata
      persistentVolumeClaim:
        claimName: pgdata
