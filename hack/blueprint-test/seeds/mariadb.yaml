# Shell one-liners in block scalars are the content, not prose.
# yamllint disable rule:line-length
# Seed for blueprints/mariadb.yaml. Datadir is /var/lib/mysql (uid 999), the PVC root.
# Writes the canary, then kill -9 mariadbd so the backup is crash-consistent.
# The check must recover from the redo log on boot.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
    - name: chown-data
      image: busybox:1.37
      securityContext:
        runAsUser: 0
      command:
        - "/bin/sh"
        - "-c"
        - "chown 999:999 /var/lib/mysql"
      volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
  containers:
    - name: seed
      image: mariadb:11.4
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          mariadb-install-db --user=mysql --datadir=/var/lib/mysql --auth-root-authentication-method=normal >/tmp/init.log 2>&1
          mariadbd --user=mysql --datadir=/var/lib/mysql --socket=/tmp/mariadb.sock \
              --skip-networking >/tmp/mariadbd.log 2>&1 &
          pid=$!
          for i in $(seq 1 150); do
            mariadb-admin -S /tmp/mariadb.sock -u root ping >/dev/null 2>&1 && break
            sleep 1
          done
          mariadb -S /tmp/mariadb.sock -u root -e "create database bret"
          mariadb -S /tmp/mariadb.sock -u root -e "create table bret.canary(id int primary key, payload text, sha256 char(64)); insert into bret.canary values (1, 'seed-canary-payload-42-not-secret', sha2('seed-canary-payload-42-not-secret', 256))"
          mariadb -S /tmp/mariadb.sock -u root -D bret -e "create table filler as select seq as id, md5(seq) as h from seq_1_to_1000"
          # Crash-consistent point: no clean shutdown.
          kill -9 "$pid"
          sleep 2
      volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
