# Seed for examples/restoreblueprint-minimal.yaml. One volume, key "data".
# Writes /data/canary.txt and its SHA-256 into /data/canary.sha256, owned by uid 1000.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: csi-hostpath-sc
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
  - name: chown-data
    image: busybox:1.37
    securityContext:
      runAsUser: 0
    command: [/bin/sh, -c, "chown 1000:1000 /data"]
    volumeMounts:
    - name: data
      mountPath: /data
  containers:
  - name: seed
    image: busybox:1.37
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    command:
    - /bin/sh
    - -c
    - |
      set -eu
      payload="canary-payload-$(date +%s)"
      printf '%s' "$payload" > /data/canary.txt
      sha256sum /data/canary.txt | cut -d ' ' -f 1 > /data/canary.sha256
      sync
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data
