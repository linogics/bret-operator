# Seed for blueprints/n8n.yaml. Data dir is /home/node/.n8n (uid 1000, PVC root).
# The n8n-secrets Secret is test-only: the check reads the same key from it.
# Imports the canary credential and workflow with the CLI, starts the server so it migrates and
# reports healthy, then kill -9 so the backup is crash-consistent.
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
type: Opaque
stringData:
  N8N_ENCRYPTION_KEY: seed-n8n-encryption-key-not-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: csi-hostpath-sc
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
  - name: chown-data
    image: busybox:1.37
    securityContext:
      runAsUser: 0
    command: [/bin/sh, -c, "chown 1000:1000 /home/node/.n8n"]
    volumeMounts:
    - name: data
      mountPath: /home/node/.n8n
  containers:
  - name: seed
    image: n8nio/n8n:1.60.0
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    envFrom:
    - secretRef:
        name: n8n-secrets
    command:
    - /bin/sh
    - -c
    - |
      set -eu
      cat > /tmp/creds.json <<'JSON'
      [{"id":"1","name":"bret-canary","type":"httpBasicAuth","data":{"user":"bret","password":"seed-password-not-secret"},"nodesAccess":[]}]
      JSON
      cat > /tmp/wf.json <<'JSON'
      [{"id":"1","name":"bret-canary","nodes":[],"connections":{},"active":false,"settings":{}}]
      JSON
      n8n import:credentials --input=/tmp/creds.json
      n8n import:workflow --input=/tmp/wf.json
      n8n start >/tmp/seed-n8n.log 2>&1 &
      pid=$!
      for i in $(seq 1 180); do
        wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 && break
        sleep 1
      done
      wget -qO- http://127.0.0.1:5678/healthz | grep -q '"status":"ok"'
      sync
      # Crash-consistent point: no clean shutdown.
      kill -9 "$pid"
      sleep 2
    volumeMounts:
    - name: data
      mountPath: /home/node/.n8n
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data
