name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    # Skip on [skip ci], [ci skip], [skip-ci], [ci-skip] or [no ci] in the commit message or PR title (any case).
    if: >-
      ${{
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[skip ci]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[ci skip]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[skip-ci]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[ci-skip]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[no ci]')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
