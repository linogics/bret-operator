name: YAML lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    uses: ./.github/workflows/skip-ci.yml

  yamllint:
    name: yamllint
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Lint YAML
        run: make yamllint
