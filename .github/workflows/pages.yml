name: Pages

# Builds the docs site in docs/ on pull requests. On main it also deploys it to GitHub Pages.
# The repository Pages source must be "GitHub Actions". The custom domain is set in the Pages settings.

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "api/**"
      - "internal/**"
      - "hack/docs-facts.sh"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "api/**"
      - "internal/**"
      - "hack/docs-facts.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  D2_VERSION: "v0.9.0"

jobs:
  guard:
    uses: ./.github/workflows/skip-ci.yml

  build:
    name: Build the docs site
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install d2
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version

      - name: No em-dashes in docs
        run: |
          if grep -rn '—' docs/src/content/docs; then
            echo "Replace em-dashes with a comma or a new sentence."
            exit 1
          fi

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
