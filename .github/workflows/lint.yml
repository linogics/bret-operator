name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    # Skip on [skip ci], [ci skip], [skip-ci], [ci-skip] or [no ci] in the commit message or PR title (any case).
    if: >-
      ${{
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[skip ci]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[ci skip]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[skip-ci]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[ci-skip]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[no ci]')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --timeout=10m

  formatting:
    name: gofmt and goimports
    # Skip on [skip ci], [ci skip], [skip-ci], [ci-skip] or [no ci] in the commit message or PR title (any case).
    if: >-
      ${{
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[skip ci]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[ci skip]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[skip-ci]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[ci-skip]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[no ci]')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l api cmd internal test)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi
