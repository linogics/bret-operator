name: Docs

# Regenerates the API reference (docs/reference/api.md) and the chart README from source,
# then fails if the committed files differ. Fix with: make docs && git add docs charts

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  generated-docs:
    name: Generated docs are up to date
    # Skip on [skip ci], [ci skip], [skip-ci], [ci-skip] or [no ci] in the commit message or PR title (any case).
    if: >-
      ${{
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[skip ci]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[ci skip]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[skip-ci]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[ci-skip]') &&
        !contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[no ci]')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate and compare
        run: make docs-check
