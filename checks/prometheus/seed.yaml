# Seed for restorecheck.yaml in this folder. Mount is /prometheus, owned by uid 65534.
# Writes one TSDB block with the series bret_canary_seq: 42 samples over the last 42 minutes,
# last value 42 at now. The max over the window is the canary value.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
    - name: chown-data
      image: busybox:1.37
      securityContext:
        runAsUser: 0
      command:
        - "/bin/sh"
        - "-c"
        - "chown 65534:65534 /prometheus"
      volumeMounts:
        - name: data
          mountPath: /prometheus
  containers:
    - name: seed
      image: prom/prometheus:v2.54.1
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          om=/tmp/canary.om
          now=$(date +%s)

          # bret_canary_seq counts 1..42, one sample per minute, ending now.
          echo '# TYPE bret_canary_seq gauge' > "$om"
          for i in $(seq 1 42); do
            ts=$((now - (42 - i) * 60))
            printf 'bret_canary_seq %s %s.000\n' "$i" "$ts" >> "$om"
          done
          echo '# EOF' >> "$om"

          # Write the samples as TSDB blocks straight into the data dir.
          promtool tsdb create-blocks-from openmetrics "$om" /prometheus
          sync
      volumeMounts:
        - name: data
          mountPath: /prometheus
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
