# RestoreCheck for gitea 1.22 with SQLite (default). One PVC, mounted at /data.
# The mount path equals the image default data path. Absolute paths in app.ini still resolve.
# Canary contract: public repo bret/canary. It holds canary.txt and canary.sha256 (sha256sum format).
apiVersion: bret.linogics.io/v1alpha1
kind: RestoreCheck
metadata:
  name: gitea
spec:
  restoredVolumes:
    - sourcePVC: data
      mountPath: /data

  initContainers: []

  containers:
    - name: check
      image: gitea/gitea:1.22
      securityContext:
        runAsUser: 1000
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          # Start the web server with the restored app.ini and stop it on exit.
          gitea web --config /data/gitea/conf/app.ini >/tmp/gitea.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          # Wait for health (up to 120 s).
          for i in $(seq 1 120); do
            wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          # Health: DB opened and migrated, app serving.
          wget -qO- http://127.0.0.1:3000/api/healthz | grep -q '"status": *"pass"'

          # Canary: git objects and file content must match the stored checksum.
          base=http://127.0.0.1:3000/bret/canary/raw/branch/main
          got=$(wget -qO- "$base/canary.txt" | sha256sum | cut -d' ' -f1)
          want=$(wget -qO- "$base/canary.sha256" | cut -d' ' -f1)
          test "$got" = "$want"

  volumes: []
