# Seed for restorecheck.yaml in this folder. Mount is /data, owned by uid 1000.
# Starts gitea on a fresh app.ini and SQLite DB, creates user bret and public repo bret/canary
# through the API, commits canary.txt and canary.sha256 on main, then kill -9 the server so the
# backup is crash-consistent.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
    - name: chown-data
      image: busybox:1.37
      securityContext:
        runAsUser: 0
      command:
        - "/bin/sh"
        - "-c"
        - "chown 1000:1000 /data"
      volumeMounts:
        - name: data
          mountPath: /data
  containers:
    - name: seed
      image: gitea/gitea:1.22
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          conf=/data/gitea/conf/app.ini
          api=http://127.0.0.1:3000/api/v1
          json='Content-Type: application/json'
          pw=seed-pass-not-secret

          # Minimal app.ini: sqlite, no SSH, install locked so the web installer never runs.
          mkdir -p /data/gitea/conf /data/git/repositories
          secret=$(gitea generate secret SECRET_KEY)
          internal=$(gitea generate secret INTERNAL_TOKEN)
          cat > "$conf" <<INI
          APP_NAME = Bret Canary
          RUN_MODE = prod

          [database]
          DB_TYPE = sqlite3
          PATH = /data/gitea/gitea.db

          [repository]
          ROOT = /data/git/repositories

          [server]
          HTTP_PORT = 3000
          ROOT_URL = http://127.0.0.1:3000/
          APP_DATA_PATH = /data/gitea
          DISABLE_SSH = true
          LFS_START_SERVER = false

          [security]
          INSTALL_LOCK = true
          SECRET_KEY = $secret
          INTERNAL_TOKEN = $internal

          [log]
          MODE = console
          ROOT_PATH = /tmp
          INI

          # Start the web server in the background.
          gitea web --config "$conf" >/tmp/seed-gitea.log 2>&1 &
          pid=$!

          # Wait for health (up to 120 s).
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/healthz >/dev/null

          # Admin user that owns the canary repo.
          gitea admin user create --config "$conf" \
              --username bret \
              --password "$pw" \
              --email bret@example.invalid \
              --admin \
              --must-change-password=false

          # Canary repo, initialized on branch main.
          repo='{"name":"canary","auto_init":true,"default_branch":"main","private":false}'
          curl -fsS -u "bret:$pw" -H "$json" -d "$repo" "$api/user/repos" >/dev/null

          # put <path> <content> commits one file to main through the contents API.
          put() {
            b64=$(printf '%s' "$2" | base64 | tr -d '\n')
            body="{\"content\":\"$b64\",\"branch\":\"main\",\"message\":\"add $1\"}"
            curl -fsS -u "bret:$pw" -X POST -H "$json" -d "$body" \
                "$api/repos/bret/canary/contents/$1" >/dev/null
          }

          # Canary file and its checksum file.
          payload="canary-payload-$(date +%s)"
          sha=$(printf '%s' "$payload" | sha256sum | cut -d' ' -f1)
          put canary.txt "$payload"
          put canary.sha256 "$(printf '%s  canary.txt\n' "$sha")"

          # Crash-consistent point: no clean shutdown.
          kill -9 "$pid"
          sync
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
