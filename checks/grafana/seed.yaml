# Seed for restorecheck.yaml in this folder. Mount is /var/lib/grafana, owned by uid 472.
# Starts grafana on a fresh grafana.db with the admin password from Secret grafana-admin,
# creates dashboard uid and title bret-canary through the API, then kill -9 the server so the
# backup is crash-consistent.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: "seed-admin-not-secret"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
    - name: chown-data
      image: busybox:1.37
      securityContext:
        runAsUser: 0
      command:
        - "/bin/sh"
        - "-c"
        - "chown 472:472 /var/lib/grafana"
      volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
  containers:
    - name: seed
      image: grafana/grafana:11.2.0
      securityContext:
        runAsUser: 472
        runAsGroup: 472
      envFrom:
        - secretRef:
            name: grafana-admin
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          grafana=http://127.0.0.1:3000

          # Start grafana in the background. First boot creates and migrates grafana.db.
          /usr/share/grafana/bin/grafana server --homepath /usr/share/grafana \
              >/tmp/seed-grafana.log 2>&1 &
          pid=$!

          # Wait for health (up to 120 s).
          for i in $(seq 1 120); do
            curl -fsS "$grafana/api/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "$grafana/api/health" >/dev/null

          # Canary dashboard, stored in grafana.db.
          dashboard='{"uid":"bret-canary","title":"bret-canary","panels":[],"schemaVersion":39}'
          curl -fsS -u "admin:$GF_SECURITY_ADMIN_PASSWORD" -X POST \
              -H 'Content-Type: application/json' \
              -d "{\"dashboard\":$dashboard,\"overwrite\":true}" \
              "$grafana/api/dashboards/db" >/dev/null

          # Crash-consistent point: no clean shutdown.
          kill -9 "$pid"
          sync
      volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
