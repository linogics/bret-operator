# RestoreCheck for redis 7.4. Database only (RDB or AOF in /data).
# Canary contract: keys bret:canary:payload and bret:canary:sha256 (hex sha256 of payload).
# Seed the canary keys before the backup.
apiVersion: bret.linogics.io/v1alpha1
kind: RestoreCheck
metadata:
  name: redis
spec:
  restoredVolumes:
    - sourcePVC: data
      mountPath: /data

  initContainers: []

  containers:
    - name: check
      image: redis:7.4
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          # Server refuses a corrupt RDB or AOF, so a clean start is the first check.
          # Use AOF mode only when the restored data has an appendonlydir.
          appendonly=no
          [ -d /data/appendonlydir ] && appendonly=yes

          # Start the server on the restored /data and stop it on exit.
          redis-server --dir /data --port 6379 --save "" --appendonly "$appendonly" \
              --daemonize yes --logfile /tmp/redis.log
          for i in $(seq 1 60); do
            redis-cli -p 6379 ping >/dev/null 2>&1 && break
            sleep 1
          done
          trap 'redis-cli -p 6379 shutdown nosave >/dev/null 2>&1 || true' EXIT

          # Canary: payload must hash to the stored digest.
          payload=$(redis-cli -p 6379 GET bret:canary:payload)
          expected=$(redis-cli -p 6379 GET bret:canary:sha256)
          test "$(printf %s "$payload" | sha256sum | cut -d' ' -f1)" = "$expected"

  volumes: []
