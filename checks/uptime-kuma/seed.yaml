# Seed for restorecheck.yaml in this folder. Mount is /app/data, owned by uid 1000 (node).
# Init "migrate" starts uptime-kuma once so it creates and migrates kuma.db, then stops it.
# Main "seed" inserts the inactive monitor bret-canary into the monitor table and exits 0.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
    - name: chown-data
      image: busybox:1.37
      securityContext:
        runAsUser: 0
      command:
        - "/bin/sh"
        - "-c"
        - "chown 1000:1000 /app/data"
      volumeMounts:
        - name: data
          mountPath: /app/data
    - name: migrate
      image: louislam/uptime-kuma:1.23.15
      securityContext:
        runAsUser: 1000
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          cd /app

          # Start the app in the background. First boot creates and migrates kuma.db.
          node server/server.js >/tmp/seed-kuma.log 2>&1 &
          pid=$!

          # Wait for the entry page (up to 120 s).
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:3001/api/entry-page >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/entry-page >/dev/null 2>&1

          # Clean stop, so the seed container is the only writer. wait reports the kill signal.
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          test -s /app/data/kuma.db
      volumeMounts:
        - name: data
          mountPath: /app/data
  containers:
    - name: seed
      image: louislam/uptime-kuma:1.23.15
      securityContext:
        runAsUser: 1000
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          # Insert the canary monitor. Other NOT NULL columns without a default get a zero
          # value, so the insert survives schema changes between versions.
          cat > /tmp/seed-kuma.js <<'JS'
          const sqlite3 = require('/app/node_modules/@louislam/sqlite3');

          const db = new sqlite3.Database('/app/data/kuma.db');

          const known = {
            name: 'bret-canary',
            active: 0,
            user_id: 1,
            interval: 60,
            url: 'https://bret-canary.invalid/',
            type: 'http',
            weight: 2000,
            created_date: new Date().toISOString(),
            accepted_statuscodes_json: '["200-299"]',
          };

          function fail(err) {
            console.error(err);
            process.exit(1);
          }

          function zero(type) {
            if (/INT/i.test(type)) {
              return 0;
            }
            if (/BLOB/i.test(type)) {
              return Buffer.alloc(0);
            }
            return '';
          }

          db.all('pragma table_info(monitor)', (err, cols) => {
            if (err) {
              fail(err);
            }

            const row = {};
            for (const c of cols) {
              if (c.name in known) {
                row[c.name] = known[c.name];
              } else if (c.notnull && c.dflt_value === null && c.pk === 0) {
                row[c.name] = zero(c.type);
              }
            }

            const names = Object.keys(row);
            const marks = names.map(() => '?').join(',');
            const sql = `insert into monitor (${names.join(',')}) values (${marks})`;
            db.run(sql, names.map((n) => row[n]), (err2) => {
              if (err2) {
                fail(err2);
              }
              db.close();
            });
          });
          JS
          node /tmp/seed-kuma.js
      volumeMounts:
        - name: data
          mountPath: /app/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
