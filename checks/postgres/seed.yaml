# Seed for restorecheck.yaml in this folder. Data dir is <mount>/pgdata (PGDATA), owned by uid 999.
# Writes the canary, then kill -9 the postmaster so the backup is crash-consistent.
# The check must recover WAL on boot.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: seed
spec:
  restartPolicy: Never
  initContainers:
    - name: chown-data
      image: busybox:1.37
      securityContext:
        runAsUser: 0
      command:
        - "/bin/sh"
        - "-c"
        - "chown 999:999 /var/lib/postgresql/data"
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  containers:
    - name: seed
      image: postgres:17.12
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          payload=canary-payload-42

          # Fresh cluster, socket only.
          mkdir -p "$PGDATA"
          chmod 0700 "$PGDATA"
          initdb -D "$PGDATA" -U postgres --auth=trust >/dev/null
          pg_ctl -D "$PGDATA" -l /tmp/seed.log -o "-k /tmp -c listen_addresses=''" -w start

          # Canary row: payload and its sha256.
          psql -h /tmp -U postgres -c "create database app"
          psql -h /tmp -U postgres -d app \
              -c "create table bret_canary(id int primary key, payload text, sha256 text)"
          psql -h /tmp -U postgres -d app \
              -c "insert into bret_canary values (1, '$payload', encode(sha256('$payload'::bytea), 'hex'))"

          # Filler rows so the WAL holds more than the canary.
          psql -h /tmp -U postgres -d app \
              -c "create table filler as select g, md5(g::text) from generate_series(1, 20000) g"

          # Crash-consistent point: no clean shutdown.
          kill -9 "$(head -1 "$PGDATA/postmaster.pid")"
          sleep 2
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
