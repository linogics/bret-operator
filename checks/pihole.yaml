# TESTED: round trip PASS. Negative test FAIL, as expected.
# Two volumes: /etc/pihole (gravity.db, setupVars, custom.list) and /etc/dnsmasq.d.
# Canary contract: the adlist https://bret-canary.invalid/list.txt is in gravity.db.
# The line "10.0.0.53 bret-canary.test" is in /etc/pihole/custom.list. Seed both before the backup.
apiVersion: bret.linogics.io/v1alpha1
kind: RestoreCheck
metadata:
  name: pihole
  namespace: default
spec:
  restoredVolumes:
    - sourcePVC: etc-pihole
      mountPath: /etc/pihole
    - sourcePVC: dnsmasq
      mountPath: /etc/dnsmasq.d

  initContainers: []

  containers:
    - name: check
      image: pihole/pihole:2024.07.0
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          # gravity.db is structurally sound and holds the canary adlist.
          sqlite3 /etc/pihole/gravity.db 'pragma integrity_check' | grep -qx ok
          sql="select count(*) from adlist"
          sql="$sql where address = 'https://bret-canary.invalid/list.txt'"
          test "$(sqlite3 /etc/pihole/gravity.db "$sql")" = 1

          # Canary local DNS record is present in the restored config.
          grep -qx '10.0.0.53 bret-canary.test' /etc/pihole/custom.list

          # dnsmasq config from the restored /etc/dnsmasq.d parses.
          pihole-FTL dnsmasq-test

  volumes: []
