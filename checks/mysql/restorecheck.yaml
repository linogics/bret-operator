# Round trip PASS. Negative check FAIL on kind (2026-11-14), mysql 8.4.13.
# RestoreCheck for mysql 8.4. Database only. One PVC.
# Canary contract: table bret.canary(id int primary key, payload text, sha256 char(64)).
# Row id=1 holds sha256 = sha2(payload, 256). Seed it before the backup.
apiVersion: bret.linogics.io/v1alpha1
kind: RestoreCheck
metadata:
  name: mysql
spec:
  restoredVolumes:
    - sourcePVC: data
      mountPath: /var/lib/mysql

  initContainers: []

  containers:
    - name: check
      image: mysql:8.4
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          sock=/tmp/mysql.sock

          # Start mysqld on the restored datadir, socket only.
          mysqld --user=mysql --datadir=/var/lib/mysql --socket="$sock" \
              --skip-networking --mysqlx=OFF >/tmp/mysqld.log 2>&1 &
          for i in $(seq 1 150); do
            mysqladmin -u root -S "$sock" ping >/dev/null 2>&1 && break
            sleep 1
          done
          trap 'mysqladmin -u root -S "$sock" shutdown || true' EXIT

          # Server must be up. Dump its log on failure, crash recovery errors land there.
          if ! mysqladmin -u root -S "$sock" ping >/dev/null 2>&1; then
            cat /tmp/mysqld.log >&2
            exit 1
          fi

          # Table-level CHECK TABLE across all user databases. The 8.4 image has no mysqlcheck.
          sql="select group_concat(concat('\`', table_schema, '\`.\`', table_name, '\`') separator ', ')"
          sql="$sql from information_schema.tables"
          sql="$sql where table_schema not in ('mysql', 'information_schema', 'performance_schema', 'sys')"
          tables=$(mysql -u root -S "$sock" -N -e "$sql")
          if [ "$tables" != NULL ]; then
            if mysql -u root -S "$sock" -N -e "check table $tables" | grep -iv 'status.*OK'; then
              echo "CHECK TABLE reported a problem" >&2
              exit 1
            fi
          fi

          # Canary row: payload must still hash to the stored sha256.
          sql="select count(*) from bret.canary where id = 1 and sha2(payload, 256) = sha256"
          test "$(mysql -u root -S "$sock" -N -e "$sql")" = 1

  volumes: []
