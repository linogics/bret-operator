# yamllint config. Non-empty flow style ([a, b], {a: 1}) is forbidden: write block
# lists and block mappings. Empty [] and {} are allowed.
extends: default

ignore: |
  # Helm templates are not plain YAML.
  charts/*/templates/
  # Generated by controller-gen and make helm-sync. Do not edit by hand.
  config/crd/bases/
  charts/*/crds/
  # Vendored subchart archives and dependency lock.
  charts/*/charts/
  charts/*/Chart.lock
  # controller-gen output (make manifests). Flow style comes from the generator.
  config/rbac/role.yaml

rules:
  braces:
    forbid: non-empty
  brackets:
    forbid: non-empty
  # GitHub Actions uses the `on:` key.
  truthy:
    check-keys: false
  line-length:
    max: 160
  # Commented-out examples under empty keys (charts/bret-operator/values.yaml) are not content.
  comments-indentation: disable
  document-start: disable
  comments:
    min-spaces-from-content: 1
