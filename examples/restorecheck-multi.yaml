# A RestoreCheck for an app with two PVCs: nextcloud files (html) and its database (pgdata).
# Each restoredVolumes entry names the PVC in the backed-up namespace (sourcePVC).
# A Restore or RestoreTest must have one source for every sourcePVC listed here.
# The check reads both volumes. The two canary files must come from the same backup point.
apiVersion: bret.linogics.io/v1alpha1
kind: RestoreCheck
metadata:
  name: nextcloud
  namespace: nextcloud
  annotations:
    bret.linogics.io/mover-uid: '{"html": 33, "pgdata": 999}'  # Optional. Mover UID per sourcePVC.
spec:
  restoredVolumes:
    - sourcePVC: html
      mountPath: /var/www/html
    - sourcePVC: pgdata
      mountPath: /var/lib/postgresql/data
  containers:
    - name: check
      image: busybox:1.37
      securityContext:
        runAsUser: 0            # Read-only checks. The restored roots are owned by the mover UIDs.
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          test -f /var/www/html/config/config.php
          test -f /var/lib/postgresql/data/PG_VERSION
          echo "both volumes ok"
