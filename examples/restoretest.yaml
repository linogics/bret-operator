# RestoreTest: test the newest orders-db backup every night, and after each new backup.
# Blueprint: examples/restoreblueprint-minimal.yaml (or your own).
apiVersion: bret.linogics.io/v1alpha1
kind: RestoreTest
metadata:
  name: orders-db-nightly
  namespace: data
spec:
  provider: volsync
  backupSelector:
    labels:
      app.kubernetes.io/name: orders-db
  blueprintRef:
    name: minimal
  triggers:
    cron: "17 3 * * *"          # 03:17 UTC every day
    afterBackup:
      delay: 30m                # also 30 minutes after each new backup completes
    manual: true                # run on demand with the run-now annotation
  restoreWindow: 45m            # per attempt: restore, image pulls and check
  retries:
    count: 2                    # up to 3 attempts in total
    backoff: 10m                # wait between attempts
  keepOnFailure: true           # keep the pod, PVC and restore after the last failed attempt
  overlapPolicy: Skip           # a trigger during a run is dropped (default)
