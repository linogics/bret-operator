# RestoreTest: test the newest nextcloud backups every night. Test again after each new backup.
# One source per PVC. Each backup selector matches Kopiur Snapshot objects in this namespace.
# Each run restores the newest Snapshot of every source. Check: examples/restorecheck-multi.yaml.
apiVersion: bret.linogics.io/v1alpha1
kind: RestoreTest
metadata:
  name: nextcloud-nightly
  namespace: nextcloud
spec:
  provider: kopiur
  sources:
    - sourcePVC: html
      backupSelector:
        labels:
          app.kubernetes.io/name: nextcloud-html
      storageClassName: fast-ssd
      size: 20Gi                # Optional. Default: the source size.
    - sourcePVC: pgdata
      backupSelector:
        labels:
          app.kubernetes.io/name: nextcloud-pgdata
      storageClassName: fast-ssd
      size: 10Gi
  restoreCheckRef:
    name: nextcloud
  triggers:
    cron: "17 3 * * *"          # 03:17 UTC every day
    afterBackup:
      delay: 30m                # Also run 30 minutes after every source has a new backup.
    manual: true                # Run on demand with the run-now annotation.
  restoreWindow: 45m            # Per attempt: restore, image pulls, and check.
  retries:
    count: 2                    # Up to 3 attempts in total.
    backoff: 10m                # Wait between attempts.
  keepOnFailure: true           # Keep the pod, PVCs, and restores after the last failed attempt.
  overlapPolicy: Skip           # A trigger during a run is dropped. This is the default.
