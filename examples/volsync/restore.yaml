# NOTICE: only for manual tests. Do not deploy this for regular restore testing.
# A RestoreTest creates and manages its own Restore objects on its schedule. Use restoretest.yaml for that.
# This file is a hand-made Restore that mimics one of those, to run a single restore by hand.
#
# Restore: one manual restore test of the newest restic snapshot of each ReplicationSource.
# backupRef names the ReplicationSource. restoreAsOf (optional) pins an older snapshot.
# Restored claims: <restore>-<sourcePVC>, here wordpress-manual-html and wordpress-manual-mysql.
apiVersion: bret.linogics.io/v1alpha1
kind: Restore
metadata:
  name: wordpress-manual
spec:
  provider: volsync
  sources:
    - sourcePVC: html
      backupRef:
        name: html                       # The ReplicationSource of the html PVC.
      storageClassName: csi-hostpath-sc
    - sourcePVC: mysql
      backupRef:
        name: mysql
      storageClassName: csi-hostpath-sc
  restoreCheckRef:
    name: wordpress
