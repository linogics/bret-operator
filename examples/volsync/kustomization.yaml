# WordPress backed up with VolSync. Apply with: kubectl apply -k examples/volsync -n <namespace>
# Needs the Secrets restic-html and restic-mysql first (see https://bret-operator.linogics.io/providers/volsync/walkthrough/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../wordpress
  - backup.yaml
