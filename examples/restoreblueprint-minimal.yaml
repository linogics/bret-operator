# Smallest working RestoreBlueprint: one volume, one check container.
# The volume is restored to /data. The check recomputes the SHA-256 of the canary file.
# Canary contract: /data/canary.txt holds the payload, /data/canary.sha256 holds its hash.
# The seed for this check is hack/blueprint-test/seeds/minimal.yaml.
apiVersion: restore.bret.linogics.io/v1alpha1
kind: RestoreBlueprint
metadata:
  name: minimal
  namespace: data
spec:
  restoreMount: /data
  containers:
    - name: check
      image: busybox:1.37
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          test -f /data/canary.txt
          expected="$(cat /data/canary.sha256)"
          actual="$(sha256sum /data/canary.txt | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          echo "canary ok"
