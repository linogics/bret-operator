# Restore: one manual restore attempt of a named backup. Usually a RestoreTest creates these.
# The check that runs afterwards is set by the RestoreTest, so this object alone runs no check yet.
apiVersion: restore.bret.linogics.io/v1alpha1
kind: Restore
metadata:
  name: orders-db-manual
  namespace: data
spec:
  provider: velero
  source:
    backupRef:
      name: orders-db-2026-11-14
      namespace: velero          # the namespace where Velero keeps its Backup objects
  target:
    storageClassName: fast-ssd   # storage class for the scratch volume
    size: 20Gi                   # scratch volume size, at least the source size
