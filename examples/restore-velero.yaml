# Restore: one manual restore attempt. A RestoreTest usually creates these.
# The check in restoreCheckRef runs after the restore. Check: examples/restorecheck-multi.yaml.
# Velero: every source names its PVC, and all sources share one Velero Backup, which holds the
# whole namespace. spec.velero.labelSelector limits what is restored. Label every app PVC.
# PVCs are restored under their source names (html, pgdata) into a bret-scratch-<hash> namespace.
apiVersion: bret.linogics.io/v1alpha1
kind: Restore
metadata:
  name: nextcloud-manual
  namespace: nextcloud
spec:
  provider: velero
  sources:
    - sourcePVC: html
      backupRef:
        name: nextcloud-2026-11-14 # A Velero Backup in the Velero namespace (providers.velero.namespace).
    - sourcePVC: pgdata
      backupRef:
        name: nextcloud-2026-11-14
  velero:
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: nextcloud # Matches html and pgdata, both labeled.
  restoreCheckRef:
    name: nextcloud
